name: svg_animate
description: Plays SVGs that declare their own animation, in SMIL or CSS keyframes, on top of the vector_graphics renderer that flutter_svg uses.
version: 0.3.5
repository: https://github.com/Treamz/svg_animate
issue_tracker: https://github.com/Treamz/svg_animate/issues

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  http: ^1.0.0
  path_parsing: ^1.0.1
  vector_graphics: ^1.2.0
  vector_graphics_compiler: ^1.1.14
  xml: ">=6.3.0 <8.0.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

topics:
  - svg
  - animation
  - vector-graphics
  - smil
