name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A pull request that is pushed to again has nothing to gain from finishing the
# run it just superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Format and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  package:
    name: Package health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The publish dry run refuses a dirty tree, so anything the tooling
      # rewrote on its own has to be visible rather than merely fatal.
      - name: Show what the tooling changed
        run: git --no-pager diff
      # Catches anything that would fail the real publish: a malformed pubspec,
      # a missing licence, files that should not ship.
      - name: Publish dry run
        run: flutter pub publish --dry-run
      # The score pub.dev will show. The threshold is the number of points that
      # may be lost before this fails, and is deliberately loose enough to
      # survive a dependency ageing out of date, but tight enough to catch a
      # missing example or undocumented API.
      - name: Score
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 20 .

  example:
    name: Build example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      # Proves the package works from the outside, as a dependency of an app,
      # rather than only from its own tests.
      - run: flutter build web --no-tree-shake-icons
        working-directory: example
