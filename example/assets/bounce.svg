<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Two transforms on one element at once, thanks to `additive="sum"`: the
       ball falls with a spline ease, and squashes as it lands. -->
  <line x1="6" y1="42" x2="42" y2="42" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="24" cy="12" rx="8" ry="8" fill="#42a5f5">
    <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0 0;0 22;0 0" keyTimes="0;0.5;1" dur="1.1s"
        calcMode="spline" keySplines="0.3 0 0.7 0;0.3 1 0.7 1"
        repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1 1;1 1;1.25 0.75;1 1;1 1" keyTimes="0;0.42;0.5;0.58;1" dur="1.1s"
        repeatCount="indefinite"/>
  </ellipse>
</svg>
