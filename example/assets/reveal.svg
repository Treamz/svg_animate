<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 48" width="120" height="48">
  <!-- A clipPath whose rect widens and narrows again, wiping the bars in and
       out. The clip is resolved again for every frame, so the reveal is
       geometry rather than an effect.

       The bars are shapes on purpose. A clip does not reach `<text>` through
       this renderer: the letters draw in full whatever the clip says. -->
  <defs>
    <clipPath id="wipe">
      <rect x="0" y="0" width="0" height="48">
        <animate attributeName="width" values="0;120;120;0" keyTimes="0;0.45;0.8;1"
            dur="3s" calcMode="spline"
            keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <g fill="#e3f2fd">
    <rect x="6" y="30" width="14" height="12" rx="3"/>
    <rect x="26" y="20" width="14" height="22" rx="3"/>
    <rect x="46" y="8" width="14" height="34" rx="3"/>
    <rect x="66" y="16" width="14" height="26" rx="3"/>
    <rect x="86" y="26" width="14" height="16" rx="3"/>
    <rect x="106" y="12" width="8" height="30" rx="3"/>
  </g>
  <g clip-path="url(#wipe)" fill="#0d47a1">
    <rect x="6" y="30" width="14" height="12" rx="3"/>
    <rect x="26" y="20" width="14" height="22" rx="3"/>
    <rect x="46" y="8" width="14" height="34" rx="3"/>
    <rect x="66" y="16" width="14" height="26" rx="3"/>
    <rect x="86" y="26" width="14" height="16" rx="3"/>
    <rect x="106" y="12" width="8" height="30" rx="3"/>
  </g>
</svg>
