<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Five bars on the same animation, each started later than the last with
       `begin`. Nothing here is a single timeline; they simply agree. -->
  <g fill="#42a5f5">
    <rect x="4" y="18" width="6" height="12" rx="3">
      <animate attributeName="y" values="18;6;18" dur="1s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="height" values="12;36;12" dur="1s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="13" y="18" width="6" height="12" rx="3" fill="#2196f3">
      <animate attributeName="y" values="18;6;18" dur="1s" begin="0.12s" repeatCount="indefinite"/>
      <animate attributeName="height" values="12;36;12" dur="1s" begin="0.12s" repeatCount="indefinite"/>
    </rect>
    <rect x="22" y="18" width="6" height="12" rx="3" fill="#1976d2">
      <animate attributeName="y" values="18;6;18" dur="1s" begin="0.24s" repeatCount="indefinite"/>
      <animate attributeName="height" values="12;36;12" dur="1s" begin="0.24s" repeatCount="indefinite"/>
    </rect>
    <rect x="31" y="18" width="6" height="12" rx="3" fill="#1565c0">
      <animate attributeName="y" values="18;6;18" dur="1s" begin="0.36s" repeatCount="indefinite"/>
      <animate attributeName="height" values="12;36;12" dur="1s" begin="0.36s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="18" width="4" height="12" rx="2" fill="#0d47a1">
      <animate attributeName="y" values="18;6;18" dur="1s" begin="0.48s" repeatCount="indefinite"/>
      <animate attributeName="height" values="12;36;12" dur="1s" begin="0.48s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
