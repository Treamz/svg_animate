<svg width="256" height="256" viewBox="0 0 256 256" fill="none"
    xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="48" y1="36" x2="214" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.48" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="gem" x1="82" y1="70" x2="178" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#D8B4FE"/>
      <stop offset="0.7" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>

    <radialGradient id="shine" cx="0" cy="0" r="1" gradientTransform="translate(92 78) rotate(45) scale(110)">
      <stop stop-color="white" stop-opacity=".9"/>
      <stop offset=".18" stop-color="white" stop-opacity=".25"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#111827" flood-opacity=".35"/>
    </filter>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect x="28" y="28" width="200" height="200" rx="56"/>
    </clipPath>
  </defs>

  <style>
    .float {
    transform-origin: 128px 128px;
    animation: float 3.2s ease-in-out infinite;
    }
    .pulse {
    transform-origin: 128px 128px;
    animation: pulse 2.4s ease-in-out infinite;
    }
    .spark {
    transform-origin: 128px 128px;
    animation: spin 5.5s linear infinite;
    }
    .spark2 {
    transform-origin: 128px 128px;
    animation: spinReverse 7s linear infinite;
    }
    .sweep {
    animation: sweep 3.4s ease-in-out infinite;
    }
    @keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-7px); }
    }
    @keyframes pulse {
    0%,100% { transform: scale(1); opacity: .8; }
    50% { transform: scale(1.055); opacity: 1; }
    }
    @keyframes spin {
    to { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
    to { transform: rotate(-360deg); }
    }
    @keyframes sweep {
    0% { transform: translateX(-150px) rotate(20deg); opacity: 0; }
    20% { opacity: .9; }
    55% { opacity: .55; }
    80%,100% { transform: translateX(240px) rotate(20deg); opacity: 0; }
    }
  </style>

  <g class="float" filter="url(#shadow)">
    <rect x="28" y="28" width="200" height="200" rx="56" fill="url(#bg)"/>
    <rect x="29" y="29" width="198" height="198" rx="55" stroke="white" stroke-opacity=".18" stroke-width="2"/>

    <circle class="pulse" cx="128" cy="128" r="76" fill="#FFFFFF" fill-opacity=".08"/>
    <circle cx="128" cy="128" r="61" fill="#0F172A" fill-opacity=".18" stroke="white" stroke-opacity=".16"/>

    <!-- diamond / premium gem -->
    <g filter="url(#glow)">
      <path d="M128 67L174 105L154 174L128 192L102 174L82 105L128 67Z"
          fill="url(#gem)" fill-opacity=".94"/>
      <path d="M82 105H174M128 67L110 105L128 192L146 105L128 67Z"
          stroke="white" stroke-opacity=".55" stroke-width="2"/>
      <path d="M82 105L128 192L174 105"
          stroke="#BFDBFE" stroke-opacity=".55" stroke-width="2"/>
    </g>

    <!-- rotating sparkles -->
    <g class="spark" fill="white">
      <path d="M128 48L132 59L143 63L132 67L128 78L124 67L113 63L124 59L128 48Z" opacity=".95"/>
      <circle cx="194" cy="129" r="4" opacity=".8"/>
      <circle cx="64" cy="144" r="3" opacity=".65"/>
    </g>

    <g class="spark2" fill="#CFFAFE">
      <path d="M183 72L186 80L194 83L186 86L183 94L180 86L172 83L180 80L183 72Z" opacity=".9"/>
      <circle cx="83" cy="77" r="3.5" opacity=".75"/>
    </g>

    <!-- animated light sweep -->
    <g clip-path="url(#clip)">
      <rect class="sweep" x="22" y="12" width="42" height="240" rx="20"
          fill="url(#shine)" transform="rotate(20 22 12)"/>
    </g>
  </g>
</svg>
